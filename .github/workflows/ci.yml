name: CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: gofmt
        run: make fmt-check
      - name: build + vet (type-check)
        run: make vet
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4.0

  test:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: tests (race detector)
        run: make test
      - name: coverage gate
        run: make cover
      - name: short fuzz pass
        run: |
          go test ./swim  -run '^$' -fuzz FuzzDecodePacket  -fuzztime 10s
          go test ./cache -run '^$' -fuzz FuzzDecodeMessage -fuzztime 10s
          go test ./ring  -run '^$' -fuzz FuzzRingOps       -fuzztime 10s

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: make build
      - name: offline demo
        run: make demo
